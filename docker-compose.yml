# Local development stack — hot reload on both backend and frontend.
#
#   cp .env.example .env      # optional: runs on built-in defaults/mocks without it
#   docker compose up --build
#
#   Backend  → http://localhost:8000/docs
#   Frontend → http://localhost:5173
#
# Production-shaped stacks live in docker-compose.prod.yml and deploy/aws-free-tier/.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travelos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelos}
      POSTGRES_DB: ${POSTGRES_DB:-travelos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travelos}"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Container-network addresses win over anything in .env.
      DATABASE_URL: postgresql+asyncpg://travelos_app:travelos_app@db:5432/${POSTGRES_DB:-travelos}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - backend-storage:/app/storage
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-storage:
  frontend-node-modules:
